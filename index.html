<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBTI 찐테스트</title>
  <meta name="description" content="12문항으로 알아보는 찐 MBTI 성격 유형 테스트" />
  <meta property="og:title" content="MBTI 찐테스트" />
  <meta property="og:description" content="당신의 진짜 MBTI는?" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <div class="hero">
        <h1 class="title">MBTI 찐테스트</h1>
        <p class="subtitle">12문항으로 알아보는 당신의 진짜 성격 유형</p>
        <div class="emoji-row">🧠 ✨ 🔮</div>
        <button id="start-btn" class="primary-btn">테스트 시작하기</button>
        <p class="meta">약 2분 소요 · 16가지 유형</p>
      </div>
    </section>

    <!-- 문항 화면 -->
    <section id="quiz-screen" class="screen">
      <div class="progress-wrap">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p class="progress-text"><span id="current-q">1</span> / <span id="total-q">12</span></p>
      </div>

      <div class="question-card">
        <p class="q-number">Q<span id="q-index">1</span>.</p>
        <h2 id="q-text" class="q-text">질문이 여기에 표시됩니다.</h2>
        <div id="answers" class="answers"></div>
      </div>

      <button id="prev-btn" class="ghost-btn" disabled>← 이전</button>
    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="screen">
      <div class="result-card">
        <p class="result-label">당신의 MBTI는</p>
        <h1 id="result-type" class="result-type">XXXX</h1>
        <h2 id="result-nickname" class="result-nickname">별명</h2>
        <p id="result-description" class="result-description">설명</p>

        <div class="result-section">
          <h3>🌟 강점</h3>
          <ul id="result-strengths"></ul>
        </div>

        <div class="result-section">
          <h3>💭 약점</h3>
          <ul id="result-weaknesses"></ul>
        </div>

        <div class="result-section">
          <h3>💘 찰떡 궁합</h3>
          <p id="result-match"></p>
        </div>

        <div class="btn-row">
          <button id="retry-btn" class="primary-btn">다시 하기</button>
          <button id="share-btn" class="ghost-btn">결과 공유하기</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made with 💜 · <a href="https://github.com/pshrec/claude-mbti" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
